<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Puerta a Puerta VIPASA</title>
<link rel="icon" href="data:,">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Filtros">☰</button>
    <div id="stats">
      <span id="statsText">Cargando datos…</span>
    </div>
    <button id="locateBtn" class="icon-btn" aria-label="Mi ubicación">◎</button>
  </header>

  <div id="syncBanner" class="hidden"></div>

  <div id="map"></div>

  <aside id="filterPanel" class="panel hidden">
    <div class="panel-header">
      <h2>Filtros</h2>
      <button class="close-btn" data-close="filterPanel">✕</button>
    </div>
    <div class="panel-body">
      <label class="field-label">Municipio</label>
      <div id="municipioFilters" class="chip-row"></div>

      <label class="field-label">Localidad</label>
      <select id="localidadFilter">
        <option value="">Todas</option>
      </select>

      <label class="field-label">Estado</label>
      <div id="estadoFilters" class="chip-row"></div>

      <label class="field-label">Otros</label>
      <div id="extraFilters" class="chip-row"></div>

      <label class="field-label">Buscar dirección</label>
      <input type="text" id="searchInput" placeholder="Ej: San Roque, Uría…" />

      <div class="legend">
        <div class="legend-item"><span class="dot dot-sin_visitar"></span> Sin visitar</div>
        <div class="legend-item"><span class="dot dot-nadie_en_casa"></span> Nadie en casa</div>
        <div class="legend-item"><span class="dot dot-no_vive_nadie"></span> Vivienda vacía</div>
        <div class="legend-item"><span class="dot dot-contactado"></span> Contactado</div>
        <div class="legend-item"><span class="dot dot-mixto"></span> Edificio mixto</div>
        <div class="legend-item">◌ Borde discontinuo = ubicación aproximada (pueblo/municipio, no calle exacta)</div>
      </div>
    </div>
  </aside>

  <section id="buildingPanel" class="panel hidden">
    <div class="panel-header">
      <h2 id="buildingTitle">Edificio</h2>
      <button class="close-btn" data-close="buildingPanel">✕</button>
    </div>
    <div class="panel-body">
      <p id="buildingSubtitle" class="muted"></p>
      <div id="unitsList"></div>
    </div>
  </section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/store.js"></script>
<script type="module" src="js/data.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
